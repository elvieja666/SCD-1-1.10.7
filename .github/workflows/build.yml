name: Compilar plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Armar paquete con el instalador
        run: |
          mkdir pkg
          cp -R build/PhantomAsym_artefacts/Release/AU build/PhantomAsym_artefacts/Release/VST3 pkg/
          cp Instalador/Instalar_rmd-1.command pkg/
          chmod +x pkg/Instalar_rmd-1.command
          (cd pkg && zip -ry ../rmd-1-mac.zip .)

      - name: Subir plugin compilado
        uses: actions/upload-artifact@v4
        with:
          name: rmd-1-mac
          path: rmd-1-mac.zip
