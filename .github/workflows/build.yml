name: Compilar plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Armar spr-1.zip (todo en la misma carpeta)
        run: |
          mkdir pkg
          cp -R build/PhantomAsym_artefacts/Release/AU/*.component build/PhantomAsym_artefacts/Release/VST3/*.vst3 pkg/
          cp Instalador/Instalar.command Instalador/Desinstalar.command pkg/
          chmod +x pkg/Instalar.command pkg/Desinstalar.command
          (cd pkg && zip -ry ../spr-1.zip .)
          unzip -l spr-1.zip | head -30

      - name: Subir spr-1.zip
        uses: actions/upload-artifact@v7
        with:
          path: spr-1.zip
          archive: false
